name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub Statistics
        uses: cicirello/user-statistician@v1
        with:
          image-file: profile/github-stats.svg
          colors: dark
          custom-title: "Manthan Nayak's GitHub Statistics"
          max-languages: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
