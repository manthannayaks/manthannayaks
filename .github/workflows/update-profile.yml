name: Update Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/portrait.png"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests beautifulsoup4 rembg onnxruntime

      - name: Generate halftone portrait
        run: python scripts/generate_portrait.py

      - name: Generate animated profile dashboard
        run: python scripts/generate_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: manthannayaks

      - name: Generate GitHub Statistics & Languages
        uses: cicirello/user-statistician@v1
        with:
          image-file: assets/github-stats.svg
          colors: dark
          custom-title: "Manthan Nayak's GitHub Statistics"
          max-languages: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/portrait-src.png assets/profile.svg assets/github-stats.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update profile assets [skip ci]"
            git push
          fi
